
services:
  - type: web
    name: studentflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STUDENTFLOW_DATA_DIR
        value: /tmp/studentflow-data
      - key: PYTHONUNBUFFERED
        value: "1"
