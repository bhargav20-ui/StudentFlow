services:
  - type: web
    name: studentflow
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STUDENTFLOW_DATA_DIR
        value: /tmp/studentflow-data
      - key: PYTHONUNBUFFERED
        value: "1"
